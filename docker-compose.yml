services:
  odoo_db:
    image: pgvector/pgvector:pg17
    container_name: postgres17_pgvector
    env_file: myenvfile.env
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - odoo-net
    restart: unless-stopped

  odoo:
    image: aungmoewai/odoo20:latest
    stdin_open: true
    tty: true
    env_file: myenvfile.env
    depends_on:
      - odoo_db
    ports:
      - "8069:8069"
    volumes:
      - ./custom_addons:/mnt/custom_addons
      - ./odoo.conf:/etc/odoo.conf
      - ./entrypoint.sh:/entrypoint.sh
      - ./logs:/var/logs/odoo
      - ./data/filestore:/data/odoo/filestore
    networks:
      - odoo-net

  pgadmin4:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - odoo_db
    networks:
      - odoo-net

volumes:
  db_data:
  pgadmin_data:


networks:
  odoo-net:
